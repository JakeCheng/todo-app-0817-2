server:
  port: 8080

spring:
  datasource:
    # MySQL 连接：Railway MySQL 插件会自动注入 MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD
    # 本地开发未设置时回退到 localhost 默认值
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:todo_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER:admin}
    password: ${MYSQLPASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 自动建表
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 方言（兼容 5.7 / 8.x）
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  jackson:
    # LocalDateTime 统一序列化格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

# JWT 配置
jwt:
  # 密钥（至少 32 字符，HS256 要求）
  # 生产环境通过环境变量 JWT_SECRET 注入，未设置时回退到本地默认值
  secret: ${JWT_SECRET:todo-secret-key-2026-please-change-in-production-env}
  # 有效期：7 天（毫秒）
  expiration: 604800000
  header: Authorization

logging:
  level:
    com.example.todo: info
    org.hibernate.SQL: warn
