server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    # 数据库连接：默认走本地值；Railway 部署时由 RailwayDatabaseConfig 从 MYSQL_URL 自动解析覆盖
    # 本地开发时 application.yml 的 spring.datasource.* 生效
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 自动建表
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 方言（兼容 5.7 / 8.x）
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  jackson:
    # LocalDateTime 统一序列化格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

# JWT 配置
jwt:
  # 密钥（至少 32 字符，HS256 要求）
  # 生产环境通过环境变量 JWT_SECRET 注入，未设置时回退到本地默认值
  secret: ${JWT_SECRET:todo-secret-key-2026-please-change-in-production-env}
  # 有效期：7 天（毫秒）
  expiration: 604800000
  header: Authorization

logging:
  level:
    com.example.todo: info
    org.hibernate.SQL: warn
